APP_VERSION_CODE=7112
APP_VERSION_NAME=12.10.6
APP_PACKAGE=dev.voidtech.glacia
IS_PRIVATE=false
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
# GLACIA JDK 25 compatibility: Gradle 9.1+ runs on Java 25.
# Keep Android app bytecode target at Java 17; do not emit Java 25 bytecode for Android.
# Android Gradle Plugin 8.13.2 and Kotlin Gradle Plugin 2.3.20 remain pinned.
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.enableResourceOptimizations=true
org.gradle.tooling.parallel=true

